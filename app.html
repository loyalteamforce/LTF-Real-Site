<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="bakim-kilidi.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Loyal Elite Force</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Caveat:wght@400;700&family=Cinzel:wght@400;700&family=Comfortaa:wght@400;700&family=Dancing+Script:wght@400;700&family=Josefin+Sans:wght@400;700&family=Lobster&family=Merriweather:wght@400;700&family=Oswald:wght@400;600&family=Pacifico&family=Playfair+Display:wght@400;700&family=Righteous&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; background:#121212; color:#fff;
  font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing:antialiased; }


/* Sitenin içeriği: her sekme bir .view. Alt menü altında kalmasın diye alt boşluk var. */
#app{ max-width:960px; margin:0 auto; padding:24px 16px; padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
.view{ display:none; }
.view.on{ display:block; animation:viewIn .3s ease both; }
.view h2{ font-size:20px; font-weight:600; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

/* ======================================================================
   ALT MENÜ (21st.dev "bottom-menu" bileşeninin siyah, saf CSS/JS karşılığı)
   Aşağı kaydırınca aşağı kayıp gizlenir, yukarı kaydırınca geri gelir.
   ====================================================================== */
.dock{ position:fixed; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); z-index:40;
  transform:translateX(-50%); transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .28s ease; }
.dock.is-hidden{ transform:translate(-50%, calc(100% + 48px)); opacity:0; pointer-events:none; }

.dock-bar{ display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:5px 7px;
  border-radius:999px; background:rgba(10,10,10,.92);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 10px 30px -6px rgba(0,0,0,.7); }
.dock-btn{ width:42px; height:42px; display:grid; place-items:center; border:none; border-radius:50%;
  background:transparent; color:#9ca3af; cursor:pointer; transition:background .2s, color .2s, transform .15s; }
.dock-btn:hover{ background:rgba(255,255,255,.1); color:#fff; }
.dock-btn:active{ transform:scale(.92); }
.dock-btn:focus-visible{ outline:2px solid #9ca3af; outline-offset:1px; }
.dock-btn[aria-current="page"]{ background:rgba(255,255,255,.16); color:#fff; }
.dock-btn svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }

.dock-tip{ position:absolute; bottom:calc(100% + 10px); left:0; height:28px; padding:0 12px; border-radius:10px;
  display:flex; align-items:center; white-space:nowrap; font-size:13px; font-weight:500; color:#fff; pointer-events:none;
  background:rgba(10,10,10,.95); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1); box-shadow:0 0 0 1px rgba(255,255,255,.04);
  opacity:0; transform:translateY(5px); transition:opacity .2s ease, transform .2s ease, left .2s ease; }
.dock-tip.on{ opacity:1; transform:none; }

@media (prefers-reduced-motion:reduce){
  .dock, .dock-tip, .view.on{ transition:none; animation:none; }
}

/* ===== MANGA SEKMESİ ===== */
.mg-h{ font-size:13px; font-weight:600; color:#9ca3af; margin:0 0 12px; }
.mg-belt{ overflow:hidden; margin:0 -16px 28px; -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); }
.mg-track{ display:flex; gap:14px; width:max-content; padding:4px 16px; animation:mgSlide 50s linear infinite; }
.mg-belt:hover .mg-track{ animation-play-state:paused; }
@keyframes mgSlide{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.mg-cover{ position:relative; flex:none; width:150px; aspect-ratio:2/3; border-radius:10px; overflow:hidden; padding:12px;
  display:flex; flex-direction:column; justify-content:flex-end; color:#fff; border:1px solid rgba(255,255,255,.12); background:linear-gradient(160deg,var(--c1),var(--c2)); cursor:pointer; text-align:left; font:inherit; }
.mg-cover::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.75)); }
.mg-cover b,.mg-cover small{ position:relative; display:block; }
.mg-cover b{ font-size:16px; line-height:1.2; font-weight:700; }
.mg-cover small{ margin-top:4px; font-size:12px; color:rgba(255,255,255,.75); }
.mg-cover .mg-big{ position:absolute; top:6px; right:10px; font-size:64px; font-weight:800; line-height:1; color:rgba(255,255,255,.16); }
.mg-cover:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
.mg-sticky{ position:sticky; top:0; z-index:30; margin:0 -16px 14px; padding:10px 16px; padding-top:max(10px, env(safe-area-inset-top)); background:#121212; }
.mg-search{ display:flex; align-items:center; gap:10px; padding:0 16px; height:46px; border-radius:999px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); }
.mg-search:focus-within{ border-color:rgba(255,255,255,.35); }
.mg-search svg{ width:18px; height:18px; flex:none; fill:none; stroke:#9ca3af; stroke-width:1.6; stroke-linecap:round; }
.mg-search input{ flex:1; min-width:0; border:none; outline:none; background:transparent; color:#fff; font:inherit; font-size:16px; }
.mg-search input::placeholder{ color:#6b7280; }
.mg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; }
.mg-grid .mg-cover{ width:auto; }
.mg-empty{ display:none; padding:32px 0; text-align:center; color:#9ca3af; font-size:14px; }
.mg-rd{ position:fixed; inset:0; z-index:60; background:#0b0b0b; display:none; flex-direction:column; }
.mg-rd.on{ display:flex; }
.mg-rd-bar{ display:flex; align-items:center; gap:12px; padding:10px 14px; padding-top:max(10px, env(safe-area-inset-top)); background:#121212; border-bottom:1px solid rgba(255,255,255,.1); }
.mg-rd-bar button{ width:38px; height:38px; flex:none; display:grid; place-items:center; border:none; border-radius:50%; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; }
.mg-rd-bar button:hover{ background:rgba(255,255,255,.2); }
.mg-rd-bar svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.mg-rd-t{ flex:1; min-width:0; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mg-rd-t small{ display:block; font-size:12px; font-weight:400; color:#9ca3af; }
.mg-tx-h{ max-width:640px; margin:0 auto 18px; padding:0 20px; font-size:22px; font-weight:700; }
.mg-tx{ max-width:640px; margin:0 auto 18px; padding:0 20px; font-size:17px; line-height:1.85; color:#e5e7eb; }
.mg-cast{ max-width:640px; margin:0 auto 20px; padding:0 20px; }
.mg-cast summary{ display:inline-block; list-style:none; cursor:pointer; padding:6px 14px; border-radius:999px; font-size:13px; color:#9ca3af; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); }
.mg-cast summary::-webkit-details-marker{ display:none; }
.mg-cast summary::after{ content:" \25BE"; }
.mg-cast[open] summary::after{ content:" \25B4"; }
.mg-cast div{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.mg-cast span{ padding:5px 11px; border-radius:12px; background:rgba(255,255,255,.06); font-size:12px; color:#e5e7eb; line-height:1.35; }
.mg-cast span b{ display:block; font-size:13px; }
.mg-cast span small{ color:#9ca3af; font-size:11px; }
/* ===== PROFİL SEKMESİ ===== */
.pf-banner{ position:relative; aspect-ratio:3/1; min-height:130px; border-radius:14px; overflow:hidden; display:grid; place-items:center;
  background:linear-gradient(135deg,#1f1f23,#2a1520); border:1px dashed rgba(255,255,255,.18); }
.pf-banner.has{ border-style:solid; border-color:rgba(255,255,255,.1); }
.pf-banner video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.pf-banner video[hidden]{ display:none; }
.pf-btn{ position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border:none; border-radius:999px; font:inherit; font-size:13px; color:#fff; cursor:pointer; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.2); }
.pf-btn:hover{ background:rgba(0,0,0,.75); }
.pf-btn svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.pf-tools{ position:absolute; right:10px; bottom:10px; z-index:1; display:flex; gap:8px; }
.pf-head{ display:flex; align-items:flex-end; gap:14px; padding:0 14px; margin-top:-46px; position:relative; z-index:2; }
.pf-av{ position:relative; flex:none; width:92px; height:92px; padding:0; border-radius:50%; overflow:hidden; cursor:pointer; display:grid; place-items:center; color:#9ca3af;
  background:#26262b; border:5px solid #121212; }
.pf-av img{ width:100%; height:100%; object-fit:cover; display:block; }
.pf-av img[hidden]{ display:none; }
.pf-av svg{ width:38px; height:38px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; }
.pf-av .pf-cam{ position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.55); opacity:0; transition:opacity .2s; color:#fff; }
.pf-av:hover .pf-cam, .pf-av:focus-visible .pf-cam{ opacity:1; }
.pf-av:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
.pf-info{ min-width:0; padding-bottom:6px; }
.pf-name{ display:flex; align-items:center; gap:6px; font-size:20px; font-weight:700; line-height:1.2; }
.pf-name span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pf-name input{ width:min(220px,60vw); padding:4px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; font:inherit; outline:none; }
.pf-ed{ flex:none; width:28px; height:28px; display:grid; place-items:center; border:none; border-radius:50%; background:transparent; color:#9ca3af; cursor:pointer; }
.pf-ed:hover{ background:rgba(255,255,255,.1); color:#fff; }
.pf-ed svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.pf-id{ margin-top:3px; font-size:13px; color:#9ca3af; }
.pf-note{ margin:6px 0 0; font-size:12px; line-height:1.4; color:#9ca3af; }
.pf-msg{ margin:10px 14px 0; font-size:13px; color:#ffb3b3; min-height:18px; }
.bio{ margin:14px 14px 0; padding:14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
.bio[hidden],.bio-edit[hidden],.bio-view[hidden]{ display:none; }
.bio-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:13px; font-weight:600; color:#9ca3af; }
.bio-view{ font-size:15px; line-height:1.6; color:#e5e7eb; overflow-wrap:anywhere; word-break:break-word; }
.bio-view.empty{ color:#6b7280; font-style:italic; }
.bio-tb{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:10px; }
.bio-tb button, .bio-tb select{ height:32px; min-width:32px; padding:0 8px; border-radius:8px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.07); color:#e5e7eb; font:inherit; font-size:13px; cursor:pointer; }
.bio-tb button:hover, .bio-tb select:hover{ background:rgba(255,255,255,.14); }
.bio-tb select{ max-width:128px; }
.bio-tb select option{ background:#1a1a1a; color:#fff; }
.bio-tb svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; vertical-align:middle; }
.bio-tb .sw{ width:22px; min-width:22px; height:22px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.25); }
.bio-tb .sep{ width:1px; height:20px; background:rgba(255,255,255,.14); margin:0 2px; }
.bio-ed{ min-height:130px; max-height:320px; overflow-y:auto; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.35); color:#e5e7eb; font-size:15px; line-height:1.6; outline:none; overflow-wrap:anywhere; }
.bio-ed:focus{ border-color:rgba(255,255,255,.45); }
.bio-ed:empty::before{ content:attr(data-ph); color:#6b7280; pointer-events:none; }
.bio-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; font-size:12px; color:#9ca3af; }
.bio-foot .over{ color:#ffb3b3; }
.bio-btn{ height:34px; padding:0 16px; margin-left:6px; border-radius:999px; border:1px solid rgba(255,255,255,.2); background:transparent; color:#fff; font:inherit; font-size:13px; cursor:pointer; }
.bio-btn.pri{ background:#fff; color:#111; border-color:#fff; font-weight:600; }
.bio-btn:disabled{ opacity:.4; cursor:not-allowed; }
.bio-fonts{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; margin-bottom:6px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.bio-fonts::-webkit-scrollbar{ display:none; }
.bio-fonts button{ flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#e5e7eb; font-size:15px; cursor:pointer; white-space:nowrap; }
.bio-fonts button:hover{ background:rgba(255,255,255,.16); }
.mg-rd-body{ flex:1; overflow-y:auto; overscroll-behavior:contain; padding:16px 0 40px; }
.mg-pg{ position:relative; width:min(100%,560px); aspect-ratio:2/3; margin:0 auto 12px; padding:14px; display:grid; gap:10px; background:#f4f4f2; }
.mg-pg i{ border:3px solid #111; background:linear-gradient(var(--a),var(--c1),var(--c2)); }
.mg-pg em{ position:absolute; right:10px; bottom:6px; font:600 12px system-ui; color:#555; }
.mg-end{ text-align:center; color:#9ca3af; font-size:14px; padding:12px 0; }
@media (prefers-reduced-motion:reduce){ .mg-track{ animation:none; overflow-x:auto; } .mg-belt{ overflow-x:auto; } }

/* ---- Supabase profil eklemeleri ---- */
#v-profil [hidden]{ display:none !important; }
.pf-banner img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.pf-av:disabled{ cursor:default; }
.pf-av:disabled .pf-cam{ display:none; }
.pf-role{ display:inline-block; margin-top:4px; padding:1px 9px; border:1px solid currentColor; border-radius:999px; font-size:11px; font-weight:600; }
.pf-search{ margin:0 0 14px; }
.pf-res{ margin-top:6px; border-radius:12px; background:#1b1b1f; border:1px solid rgba(255,255,255,.1); overflow:hidden; }
.pf-it{ display:flex; align-items:center; gap:10px; width:100%; padding:8px 12px; border:none; background:transparent; color:#fff; font:inherit; font-size:14px; text-align:left; cursor:pointer; }
.pf-it:hover{ background:rgba(255,255,255,.08); }
.pf-it img, .pf-it i{ width:32px; height:32px; border-radius:50%; object-fit:cover; background:#26262b; flex:none; }
.pf-it small{ display:block; color:#9ca3af; font-size:11px; }
.pf-empty{ padding:12px; font-size:13px; color:#9ca3af; }
.pf-back{ margin:0 0 10px; }
</style>
</head>
<body>

<main id="app">
  <section class="view" id="v-ana-sayfa"><h2>Ana Sayfa</h2></section>
  <section class="view" id="v-manga">
    <h2>Manga</h2>
    <p class="mg-h" style="margin-top:16px">Öne çıkanlar</p>
    <div class="mg-belt" aria-label="Öne çıkan mangalar"><div class="mg-track" id="mgTrack"></div></div>
    <div class="mg-sticky"><label class="mg-search">
      <svg viewBox="0 0 18 18"><circle cx="8" cy="8" r="5.25"/><line x1="11.9" y1="11.9" x2="15.5" y2="15.5"/></svg>
      <input id="mgQ" type="search" placeholder="Manga ya da tür ara" autocomplete="off">
    </label></div>
    <p class="mg-h">Tüm mangalar <span id="mgN"></span></p>
    <div class="mg-grid" id="mgGrid"></div>
    <p class="mg-empty" id="mgNo">Sonuç yok. Başka bir isim ya da tür dene.</p>
  </section>
  <section class="view" id="v-kesfet"><h2>Keşfet</h2></section>
  <section class="view" id="v-kutuphane"><h2>Kütüphane</h2></section>
  <section class="view" id="v-profil" aria-label="Profil">
    <div class="pf-search">
      <label class="mg-search"><svg viewBox="0 0 18 18"><circle cx="8" cy="8" r="5.25"/><line x1="11.9" y1="11.9" x2="15.5" y2="15.5"/></svg>
        <input id="pfQ" type="search" placeholder="Üye ara" autocomplete="off" maxlength="30"></label>
      <div class="pf-res" id="pfRes" hidden></div>
    </div>
    <button type="button" class="bio-btn pf-back" id="pfBack" hidden>&larr; Profilime dön</button>
    <div class="pf-banner" id="pfBan">
      <img id="pfBanImg" alt="" hidden>
      <video id="pfVid" muted loop autoplay playsinline hidden></video>
      <button type="button" class="pf-btn" id="pfAdd"><svg viewBox="0 0 18 18"><rect x="2" y="4" width="10" height="10" rx="2"/><path d="m12 8 4-2.5v7L12 10"/></svg>Banner ekle (foto / video)</button>
      <div class="pf-tools" id="pfTools" hidden>
        <button type="button" class="pf-btn" id="pfChg">Değiştir</button>
        <button type="button" class="pf-btn" id="pfDel">Kaldır</button>
      </div>
    </div>
    <div class="pf-head">
      <button type="button" class="pf-av" id="pfAv" aria-label="Profil fotoğrafı ekle">
        <svg id="pfPh" viewBox="0 0 18 18"><circle cx="9" cy="5.75" r="3"/><path d="M2.75 15.25c.6-2.7 3.1-4.25 6.25-4.25s5.65 1.55 6.25 4.25"/></svg>
        <img id="pfImg" alt="" hidden>
        <span class="pf-cam"><svg viewBox="0 0 18 18" style="width:24px;height:24px"><path d="M2.5 6.5h2.2l1-1.7h4.6l1 1.7h2.2v7.2h-11z"/><circle cx="9" cy="10" r="2.2"/></svg></span>
      </button>
      <div class="pf-info">
        <div class="pf-name"><span id="pfNick"></span><button type="button" class="pf-ed" id="pfEd" aria-label="İsmi düzenle"><svg viewBox="0 0 18 18"><path d="M3 15l.7-3L12 3.7a1.4 1.4 0 0 1 2 0l.3.3a1.4 1.4 0 0 1 0 2L6 14.3z"/></svg></button></div>
        <div class="pf-role" id="pfRole" hidden></div>
        <div class="pf-id" id="pfId"></div>
      </div>
    </div>
    <div class="bio" id="bio">
      <div class="bio-top"><span>Biyografi</span><button type="button" class="pf-ed" id="bioEd" aria-label="Biyografiyi düzenle"><svg viewBox="0 0 18 18"><path d="M3 15l.7-3L12 3.7a1.4 1.4 0 0 1 2 0l.3.3a1.4 1.4 0 0 1 0 2L6 14.3z"/></svg></button></div>
      <div class="bio-view" id="bioView"></div>
      <div class="bio-edit" id="bioEdit" hidden>
        <div class="bio-fonts" id="bioTb" aria-label="Yazı tipi seç"></div>
        <div class="bio-ed" id="bioEditor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Biyografi" data-ph="Kendinden bahset..."></div>
        <div class="bio-foot"><span id="bioCnt">0/500</span><span><button type="button" class="bio-btn" id="bioCancel">İptal</button><button type="button" class="bio-btn pri" id="bioSave">Kaydet</button></span></div>
      </div>
    </div>
    <p class="pf-msg" id="pfMsg" role="status"></p>
    <input type="file" id="pfFImg" accept="image/*" hidden>
    <input type="file" id="pfFVid" accept="image/*,video/*" hidden>
  </section>
</main>

<div class="mg-rd" id="mgRd" role="dialog" aria-modal="true" aria-label="Manga okuyucu">
  <div class="mg-rd-bar">
    <button type="button" id="mgBack" aria-label="Kapat"><svg viewBox="0 0 18 18"><path d="M11 3 5 9l6 6"/></svg></button>
    <div class="mg-rd-t" id="mgRdT"></div>
  </div>
  <div class="mg-rd-body" id="mgRdB"></div>
</div>

<!-- ===== ALT MENÜ ===== -->
<nav class="dock" id="dock" aria-label="Ana menü">
  <div class="dock-tip" id="dockTip" role="tooltip"></div>

<script>
  // ---------- Sekmeler (adres çubuğundaki #ana-sayfa, #manga ... ile çalışır) ----------
  (function(){
    var btns = document.querySelectorAll('.dock-btn');
    var views = document.querySelectorAll('.view');
    var DEFAULT = 'ana-sayfa';

    function go(name){
      if(!document.getElementById('v-' + name)) name = DEFAULT;
      views.forEach(function(v){ v.classList.toggle('on', v.id === 'v-' + name); });
      btns.forEach(function(b){
        if(b.dataset.view === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
      window.scrollTo(0, 0);
      if(window.__dockShow) window.__dockShow();
    }
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        if(location.hash.slice(1) === b.dataset.view) go(b.dataset.view);
        else location.hash = b.dataset.view;
      });
    });
    window.addEventListener('hashchange', function(){ go(location.hash.slice(1)); });
    go(location.hash.slice(1));
  })();

  // ---------- Alt menü: aşağı kaydırınca gizle, yukarı kaydırınca göster ----------
  (function(){
    var dock = document.getElementById('dock');
    var bar = document.getElementById('dockBar');
    var tip = document.getElementById('dockTip');
    var btns = bar.querySelectorAll('.dock-btn');
    var THRESHOLD = 8;           // px: bundan küçük titremeler yok sayılır
    var lastY = window.scrollY || 0, ticking = false, tipTimer = null;

    function hideTip(){ tip.classList.remove('on'); }
    function show(){ dock.classList.remove('is-hidden'); }
    function hide(){ dock.classList.add('is-hidden'); hideTip(); }
    window.__dockShow = function(){ lastY = window.scrollY || 0; show(); };

    function update(){
      ticking = false;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var y = Math.min(Math.max(window.scrollY || 0, 0), Math.max(max, 0));   // iOS lastik (bounce) payını kırp
      if(max <= 0 || y <= 10){ show(); lastY = y; return; }
      var d = y - lastY;
      if(d > THRESHOLD){ hide(); lastY = y; }
      else if(d < -THRESHOLD){ show(); lastY = y; }
    }
    window.addEventListener('scroll', function(){
      if(!ticking){ ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    // Klavye ile menüye gelen birinin menüsü kaybolmasın
    dock.addEventListener('focusin', show);

    // ---------- İpucu balonu (üzerine gelince etiketi göster) ----------
    function showTip(btn){
      tip.textContent = btn.dataset.label;
      tip.classList.add('on');
      var bw = bar.offsetWidth, tw = tip.offsetWidth;
      var left = btn.offsetLeft + (btn.offsetWidth - tw) / 2;
      tip.style.left = Math.max(0, Math.min(left, bw - tw)) + 'px';
    }
    btns.forEach(function(b){
      b.addEventListener('mouseenter', function(){ showTip(b); });
      b.addEventListener('mouseleave', hideTip);
      b.addEventListener('focus', function(){ showTip(b); });
      b.addEventListener('blur', hideTip);
      // Dokunmatikte hover yok: dokununca etiket kısa süre görünsün
      b.addEventListener('touchstart', function(){
        showTip(b); clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 1300);
      }, { passive: true });
    });
  })();
</script>

  }
  const bioTb = $('bioTb');
  FONT_LIST.forEach(f => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.font = f[0]; b.textContent = f[1];
    b.style.fontFamily = BIO_FONTS[f[0].toLowerCase()]; bioTb.appendChild(b);
  });
  bioTb.addEventListener('mousedown', e => { if(e.target.closest('button')) e.preventDefault(); });   // seçim kaybolmasın
  bioTb.addEventListener('click', e => { const b = e.target.closest('button[data-font]'); if(b) bioExec('fontName', b.dataset.font); });
  bioEditor.addEventListener('input', () => {
    if(!bioEditor.textContent && !bioEditor.querySelector('br + *')) bioEditor.replaceChildren();   // boşsa ipucu yazısı görünsün
    bioCount();
  });
  bioEditor.addEventListener('paste', e => {                 // dışarıdan yapıştırılan biçim/HTML alınmaz, sadece düz metin
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });
</script>

</body>
</html>
