<title>Loyal Elite Force</title>
<meta name="description" content="Loyal Elite Force (LTF), sınıflar, puan sistemi ve görevlerden oluşan bir birlik topluluğudur.">

<meta property="og:description" content="Loyal Elite Force birlik topluluğu.">

<style>
  :root{
    --bg: #08090a;
    --silver-1: #dfe1e4;
    --silver-2: #9aa0a6;
    --silver-3: #4b4f54;
    --ink-dim: #8b8f93;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow-x:hidden; }
  body{
    background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.05), transparent 60%), var(--bg);
    color:#eceeef;
    font-family:'Rajdhani', sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 24px;
  }
  .crest-wrap{ position:relative; width:150px; height:150px; margin-bottom:26px; }
  .ring{ position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(200,205,210,0.35);
    box-shadow: 0 0 0 5px rgba(255,255,255,0.03); animation: spin 12s linear infinite; }
  .ring::before{ content:''; position:absolute; top:-1px; left:50%; width:6px; height:6px; margin-left:-3px;
    background: var(--silver-1); border-radius:50%; box-shadow: 0 0 8px 2px rgba(223,225,228,0.8); }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .crest-img{ width:150px; height:150px; border-radius:50%; object-fit:contain;
    filter: drop-shadow(0 0 20px rgba(200,205,210,0.12)); }

  h1{
    font-family:'Cinzel Decorative', serif; font-weight:700; font-size: 24px; letter-spacing:5px;
    background: linear-gradient(120deg, var(--silver-2), var(--silver-1) 40%, var(--silver-2) 60%, var(--silver-3));
    background-size: 220% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shine 3.5s linear infinite;
  }
  @keyframes shine{ to{ background-position:-220% center; } }

  .tagline{ margin-top:10px; font-size:12px; letter-spacing:4px; color: var(--ink-dim); text-transform:uppercase; }

  p.desc{
    max-width: 480px; margin-top:26px; font-size:14.5px; line-height:1.7; color: var(--ink-dim);
  }

  .badge{
    margin-top:30px; padding:10px 22px; border:1px solid rgba(255,255,255,0.15); border-radius:30px;
    font-size:11px; letter-spacing:3px; color: var(--silver-1); text-transform:uppercase;
  }

  .player{ margin-top:34px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cover-wrap{
    position:relative; width:110px; height:110px; border-radius:50%; overflow:hidden;
    border:2px solid var(--silver-3); box-shadow: 0 0 24px rgba(200,205,210,0.15);
  }
  .cover-img{
    width:100%; height:100%; object-fit:cover;
    animation: spin 7s linear infinite; animation-play-state: paused;
  }
  .cover-img.playing{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .play-btn{
    position:absolute; inset:0; margin:auto; width:38px; height:38px; border-radius:50%;
    background: rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.35); color:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
    backdrop-filter: blur(2px);
  }
  .player-label{ font-size:10px; letter-spacing:2.5px; color: var(--ink-dim); text-transform:uppercase; }

  .hint{
    font-size:14px; font-weight:600; color: var(--silver-1); letter-spacing:0.5px; margin-bottom:14px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:0.75; } 50%{ opacity:1; } }
</style>
</head>
<body>

  <div class="crest-wrap">
    <div class="ring"></div>
    <img class="crest-img" src="crest.png" alt="Loyal Elite Force arması">
  </div>

  <h1>LOYAL ELITE FORCE</h1>
  <div class="tagline">Discipline · Loyalty · Strength</div>

  <p class="desc" id="statusText">
    Yönlendiriliyorsun...
  </p>

  <script>
    // Güvenlik ağı: modül script'i herhangi bir sebeple (dosya eksik,
    // ağ hatası, tarayıcı desteği vb.) çalışmazsa 4 saniye sonra
    // yine de girişe yönlendir. Modül script'i başarılı olursa zaten
    // daha erken yönlendirme yapacak ve bu zamanlayıcı devreye girmeden
    // sayfa değişmiş olacak.
    window.__lefFallback = setTimeout(function(){
      window.location.replace('login.html');
    }, 4000);
  </script>

  <script type="module">
    import { supabase } from './config.js';

    (async function boot(){
      try {
        const { data: { session } } = await supabase.auth.getSession();
        clearTimeout(window.__lefFallback);
        if(session){
          window.location.replace('app.html');
        } else {
          window.location.replace('login.html');
        }
      } catch(e){
        clearTimeout(window.__lefFallback);
        // Supabase erişilemezse yine de girişe yönlendir
        window.location.replace('login.html');
      }
    })();
  </script>

</body>
</html>
