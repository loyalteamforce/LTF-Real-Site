<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#000; }
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }

  .crest{ width:clamp(110px,24vw,190px); height:auto; opacity:0; transition:opacity .6s ease; }
  .crest.on{ opacity:1; }
</style>

<body>

  <img class="crest" id="crest" src="crest.png" alt="Loyal Elite Force">

  <noscript>
    <p style="color:#fff;font-family:sans-serif;text-align:center;position:absolute;bottom:20%;left:0;right:0;">
      Loyal Elite Force (Loyal Team Force / LTF) resmi birlik sitesi.
      <a href="login.html" style="color:#dfe1e4;">Giriş yapmak veya kayıt olmak için tıkla</a>.</p>
  </noscript>

  <script>
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.getElementById('crest').classList.add('on'); }); });
    // Güvenlik ağı: modül script'i çalışmazsa 6 saniye sonra girişe yönlendir.
    window.__lefFallback = setTimeout(function(){ window.location.replace('login.html'); }, 6000);
  </script>

  <script type="module">
    import { supabase } from './config.js';

    // Arma en az 2,5 sn görünür; oturum kontrolü bu sürede paralel yapılır.
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async function boot(){
      let session = null;
      try {
        const res = await Promise.all([supabase.auth.getSession(), wait(2500)]);
        session = res[0].data.session;
      } catch(e){ /* Supabase erişilemezse girişe yönlendir */ }
      clearTimeout(window.__lefFallback);
      if(session){
        try { sessionStorage.setItem('lefSplash', String(Date.now())); } catch(_){}   // app.html armayı tekrar göstermesin
        window.location.replace('app.html');
      } else {
        window.location.replace('login.html');
      }
    })();
  </script>
