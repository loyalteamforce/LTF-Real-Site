<style>
  :root{
    --bg: #08090a;
    --silver-1: #dfe1e4;
    --silver-2: #9aa0a6;
    --silver-3: #4b4f54;
    --ink-dim: #8b8f93;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow-x:hidden; }
  body{
    background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.05), transparent 60%), var(--bg);
    color:#eceeef;
    font-family:'Rajdhani', sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 24px;
    position:relative; overflow:hidden;
  }
  body::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 14% 24%, rgba(223,225,228,0.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 80% 20%, rgba(223,225,228,0.4), transparent 60%),
      radial-gradient(1px 1px at 36% 70%, rgba(223,225,228,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 64% 80%, rgba(223,225,228,0.35), transparent 60%),
      radial-gradient(1px 1px at 90% 55%, rgba(223,225,228,0.45), transparent 60%);
    animation: dustTwinkle 5s ease-in-out infinite;
  }
  @keyframes dustTwinkle{ 0%,100%{ opacity:0.5; } 50%{ opacity:1; } }
  .crest-wrap{ position:relative; width:150px; height:150px; margin-bottom:26px; z-index:1; }
  .crest-wrap::after{
    content:''; position:absolute; inset:-30px; z-index:-1; border-radius:50%;
    background: radial-gradient(circle, rgba(140,180,220,0.16), transparent 65%);
    animation: auraBreathe 4s ease-in-out infinite;
  }
  @keyframes auraBreathe{ 0%,100%{ opacity:0.6; transform:scale(1); } 50%{ opacity:1; transform:scale(1.1); } }
  .ring{ position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(200,205,210,0.35);
    box-shadow: 0 0 0 5px rgba(255,255,255,0.03), 0 0 22px rgba(150,180,220,0.15); animation: spin 12s linear infinite; }
  .ring::before{ content:''; position:absolute; top:-1px; left:50%; width:6px; height:6px; margin-left:-3px;
    background: var(--silver-1); border-radius:50%; box-shadow: 0 0 8px 2px rgba(223,225,228,0.8); }
  .ring::after{ content:''; position:absolute; inset:-14px; border-radius:50%; border:1px dashed rgba(150,180,220,0.25);
    animation: spin 22s linear infinite reverse; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .crest-img{ width:150px; height:150px; border-radius:50%; object-fit:contain;
    filter: drop-shadow(0 0 20px rgba(200,205,210,0.12)) drop-shadow(0 0 34px rgba(150,180,220,0.14));
    opacity:0; transform: scale(0.9); animation: crestFadeIn 1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes crestFadeIn{ to{ opacity:1; transform: scale(1); } }

  h1{
    position:relative; z-index:1;
    font-family:'Cinzel Decorative', serif; font-weight:700; font-size: 24px; letter-spacing:5px;
    background: linear-gradient(120deg, var(--silver-2), var(--silver-1) 40%, var(--silver-2) 60%, var(--silver-3));
    background-size: 260% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shine 3.5s linear infinite, titleFadeIn 1s cubic-bezier(.2,.8,.2,1) 0.2s both;
  }
  @keyframes shine{ to{ background-position:-260% center; } }
  @keyframes titleFadeIn{ 0%{ opacity:0; letter-spacing:10px; } 100%{ opacity:1; letter-spacing:5px; } }

  .tagline{ position:relative; z-index:1; margin-top:10px; font-size:12px; letter-spacing:4px; color: var(--ink-dim); text-transform:uppercase;
    opacity:0; transform: translateY(6px); animation: fadeUp 0.8s ease 0.6s forwards; }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  p.desc{
    max-width: 480px; margin-top:26px; font-size:14.5px; line-height:1.7; color: var(--ink-dim);
  }

  .badge{
    margin-top:30px; padding:10px 22px; border:1px solid rgba(255,255,255,0.15); border-radius:30px;
    font-size:11px; letter-spacing:3px; color: var(--silver-1); text-transform:uppercase;
  }

  .player{ margin-top:34px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cover-wrap{
    position:relative; width:110px; height:110px; border-radius:50%; overflow:hidden;
    border:2px solid var(--silver-3); box-shadow: 0 0 24px rgba(200,205,210,0.15);
  }
  .cover-img{
    width:100%; height:100%; object-fit:cover;
    animation: spin 7s linear infinite; animation-play-state: paused;
  }
  .cover-img.playing{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .play-btn{
    position:absolute; inset:0; margin:auto; width:38px; height:38px; border-radius:50%;
    background: rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.35); color:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
    backdrop-filter: blur(2px);
  }
  .player-label{ font-size:10px; letter-spacing:2.5px; color: var(--ink-dim); text-transform:uppercase; }

  .hint{
    font-size:14px; font-weight:600; color: var(--silver-1); letter-spacing:0.5px; margin-bottom:14px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:0.75; } 50%{ opacity:1; } }

/* ======================================================================
   MARINE FOAM — tüm sitenin sabit arka planı
   (21st.dev "Marine Foam" gradient bileşeninin saf CSS karşılığı;
   sitede React olmadığı için bileşen CSS'e çevrildi, bağımlılık yok.)
   --foam-scrim: koyu örtü. Site yazıları açık renk olduğu için gradyanın
   açık nane ucu okunmaz olmasın diye eklendi. 0 yaparsan saf gradyan görünür.
   ====================================================================== */
:root{ --foam-scrim: 0.6; }
html::before{
  content:''; position:fixed; inset:-0.8vmin; z-index:-1; pointer-events:none;
  filter: blur(0.4vmin);
  background-color:#0F5C63;
  background-image:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.060'/></svg>"),
    linear-gradient(145deg, #0F5C63 0%, #3F9EA8 33%, #A9E2D9 67%, #EAF7F2 100%);
  background-size:120px 120px, auto;
  background-blend-mode: overlay, normal;
}
html::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background: rgba(2,16,20,var(--foam-scrim));
}

<body>

  <div class="crest-wrap">
    <div class="ring"></div>
    <img class="crest-img" src="crest.png" alt="Loyal Elite Force arması">
  </div>

  <h1>LOYAL ELITE FORCE</h1>
  <div class="tagline">Discipline · Loyalty · Strength</div>

  <p class="desc" id="statusText">
    Yönlendiriliyorsun...
  </p>

  <noscript>
    <p class="desc">Loyal Elite Force (Loyal Team Force / LTF) resmi birlik sitesi.
      <a href="login.html" style="color:#dfe1e4;">Giriş yapmak veya kayıt olmak için tıkla</a>.</p>
  </noscript>

  <script>
    // Güvenlik ağı: modül script'i herhangi bir sebeple (dosya eksik,
    // ağ hatası, tarayıcı desteği vb.) çalışmazsa 4 saniye sonra
    // yine de girişe yönlendir. Modül script'i başarılı olursa zaten
    // daha erken yönlendirme yapacak ve bu zamanlayıcı devreye girmeden
    // sayfa değişmiş olacak.
    window.__lefFallback = setTimeout(function(){
      window.location.replace('login.html');
    }, 4000);
  </script>

  <script type="module">
    import { supabase } from './config.js';

    (async function boot(){
      try {
        const { data: { session } } = await supabase.auth.getSession();
        clearTimeout(window.__lefFallback);
        if(session){
          window.location.replace('app.html');
        } else {
          window.location.replace('login.html');
        }
      } catch(e){
        clearTimeout(window.__lefFallback);
        // Supabase erişilemezse yine de girişe yönlendir
        window.location.replace('login.html');
      }
    })();
  </script>

</body>
