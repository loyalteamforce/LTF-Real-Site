<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yakında Yayında - LTF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1.5rem;
        }

        .coming-soon-card {
            background: #141414;
            border: 2px solid #b8860b; /* altın sarısı */
            border-radius: 2.5rem;
            padding: 4rem 3rem;
            max-width: 720px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(184, 134, 11, 0.15);
            transition: 0.3s ease;
        }

        .logo-area {
            margin-bottom: 2.5rem;
        }

        .logo-area img {
            max-width: 100%;
            height: auto;
            max-height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(184, 134, 11, 0.3));
        }

        /* Eğer resim yüklenmezse yedek yazı */
        .logo-fallback {
            display: none;
            color: #b8860b;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .main-title {
            color: #f5f5f5;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
        }

        .main-title span {
            color: #d4af37;
        }

        .sub-message {
            color: #bbbbbb;
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        .version-badge {
            display: inline-block;
            background: #1e1e1e;
            border: 1px solid #b8860b;
            color: #d4af37;
            font-size: 1.6rem;
            font-weight: 700;
            padding: 0.5rem 2.2rem;
            border-radius: 60px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.1);
        }

        .divider {
            width: 80px;
            height: 2px;
            background: #b8860b;
            margin: 1.8rem auto;
            opacity: 0.5;
        }

        .footer-note {
            color: #666;
            font-size: 0.85rem;
            margin-top: 2rem;
            letter-spacing: 0.5px;
        }

        /* Mobil uyum */
        @media (max-width: 500px) {
            .coming-soon-card {
                padding: 2.5rem 1.5rem;
            }
            .main-title {
                font-size: 2rem;
            }
            .sub-message {
                font-size: 1rem;
            }
            .version-badge {
                font-size: 1.2rem;
                padding: 0.4rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="coming-soon-card">

        <!-- LOGO ALANI -->
        <div class="logo-area">
            <!-- SİZİN GÖNDERDİĞİNİZ GÖRSELİN YOLUNU BURAYA YAZIN -->
            <img 
                src="LoyalEliteForce.jpeg" 
                alt="Loyal Elite Force Logo" 
                onerror="this.style.display='none'; document.getElementById('fallbackText').style.display='block';"
            />
            <div id="fallbackText" class="logo-fallback">
                LOYAL<br />ELITE<br />FORCE
            </div>
        </div>

        <!-- ANA MESAJ -->
        <h1 class="main-title">
            Çok <span>Yakında</span> Sizlerleyiz
        </h1>
        <p class="sub-message">
            Yenilenen deneyim için hazırlanıyoruz.
        </p>

        <div class="divider"></div>

        <!-- VERSİYON ETİKETİ -->
        <div class="version-badge">
            LTF 3.0.0
        </div>

        <div class="footer-note">
            &copy; 2026 Loyal Elite Force
        </div>
    </div>

</body>
</html>
