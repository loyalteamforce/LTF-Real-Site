<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Loyal Elite Force</title>
<meta name="description" content="Loyal Elite Force birlik topluluğuna giriş yap veya kayıt ol.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div class="cosmic-bg" aria-hidden="true">
  <div class="flow-paths"><svg id="flowPathsSvg" viewBox="0 0 696 316" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="cosmic-arc cosmic-arc-upper"></div>
  <div class="cosmic-arc cosmic-arc-lower"></div>
  <div class="cosmic-beam"></div>
</div>

<div id="appLoading">
  <div class="crest-wrap">
    <div class="ring"></div>
    <img class="crest-img" id="loaderLogo" src="crest.png" alt="Loyal Elite Force">
    <div class="sweep"></div>
  </div>
  <div class="brand"><h1>LOYAL ELITE FORCE</h1></div>
</div>

<div id="authView">
  <div class="auth-card">
    <img class="auth-crest" src="crest.png" alt="Loyal Elite Force">
    <h1>LOYAL ELITE FORCE</h1>

    <div class="tabs">
      <button class="tab active" data-tab="login">GİRİŞ</button>
      <button class="tab" data-tab="register">KAYIT OL</button>
    </div>

    <!-- ===== LOGIN ===== -->
    <form class="form-block active" id="loginForm">
      <div class="field">
        <label for="loginUsername">Kullanıcı Adı</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Şifre</label>
        <div class="pw-field">
          <input type="password" id="loginPassword" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-target="loginPassword">👁</button>
        </div>
      </div>
      <button type="submit" class="btn" id="loginBtn">Giriş Yap</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <!-- ===== REGISTER ===== -->
    <form class="form-block" id="registerForm">
      <div class="field">
        <label for="regUsername">Kullanıcı Adı</label>
        <input type="text" id="regUsername" autocomplete="username" required>
        <div class="username-warning">Sadece küçük harf, rakam, "_" ve "." kullanılabilir. Boşluk ve Türkçe karakterler otomatik temizlenir.</div>
      </div>
      <div class="field">
        <label for="regPassword">Şifre</label>
        <div class="pw-field">
          <input type="password" id="regPassword" autocomplete="new-password" minlength="6" required>
          <button type="button" class="pw-toggle" data-target="regPassword">👁</button>
        </div>
      </div>
      <div class="field">
        <label for="regPassword2">Şifre (Tekrar)</label>
        <div class="pw-field">
          <input type="password" id="regPassword2" autocomplete="new-password" minlength="6" required>
          <button type="button" class="pw-toggle" data-target="regPassword2">👁</button>
        </div>
      </div>
      <button type="submit" class="btn" id="registerBtn">Kayıt Ol</button>
      <div class="msg" id="registerMsg"></div>
    </form>

  </div>
</div>

<script>
(function(){
  var svg = document.getElementById('flowPathsSvg');
  if(!svg) return;
  var ns = 'http://www.w3.org/2000/svg';

  function buildPaths(position){
    var count = window.innerWidth < 640 ? 14 : 22;
    for(var i = 0; i < count; i++){
      var d =
        'M-' + (380 - i * 5 * position) + ' -' + (189 + i * 6) +
        'C-' + (380 - i * 5 * position) + ' -' + (189 + i * 6) +
        ' -' + (312 - i * 5 * position) + ' ' + (216 - i * 6) +
        ' ' + (152 - i * 5 * position) + ' ' + (343 - i * 6) +
        'C' + (616 - i * 5 * position) + ' ' + (470 - i * 6) +
        ' ' + (684 - i * 5 * position) + ' ' + (875 - i * 6) +
        ' ' + (684 - i * 5 * position) + ' ' + (875 - i * 6);
      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', 'rgba(191,227,255,' + (0.05 + i * 0.018).toFixed(3) + ')');
      path.setAttribute('stroke-width', (0.5 + i * 0.03).toFixed(2));
      path.setAttribute('fill', 'none');
      path.setAttribute('class', 'flow-path');
      path.style.animationDuration = (18 + Math.random() * 14).toFixed(1) + 's';
      path.style.animationDelay = '-' + (Math.random() * 20).toFixed(1) + 's';
      svg.appendChild(path);
    }
  }
  buildPaths(1);
  buildPaths(-1);
})();
</script>

<script>
  // Güvenlik ağı: modül script'i (Supabase importu, file:// üzerinden CORS,
  // yavaş/başarısız ağ isteği vb. herhangi bir sebeple) hiç çalışmazsa
  // yükleme ekranı sonsuza kadar açık kalıp arkasını (küreyi) gizlemesin.
  window.__lefFallback = setTimeout(function(){
    var loader = document.getElementById('appLoading');
    var authView = document.getElementById('authView');
    if(loader){ loader.classList.add('done'); setTimeout(function(){ loader.style.display = 'none'; }, 700); }
    if(authView){ authView.style.display = 'flex'; }
  }, 3000);
</script>

<script type="module">
  import { supabase, usernameToEmail } from './config.js';

  const loader = document.getElementById('appLoading');
  const authView = document.getElementById('authView');
  const CLASSES = ['A', 'B', 'C', 'D'];
  const CLASS_LIMIT = 25;

  // Herkes rastgele bir sınıfa atanır; dolu olmayan sınıflar arasından
  // rastgele seçilir, hepsi doluysa en az doluya düşer.
  async function pickRandomClass(){
    try {
      const { data, error } = await supabase.from('profiles').select('class');
      if(error || !data) throw error || new Error('no data');
      const counts = {};
      CLASSES.forEach(c => counts[c] = 0);
      data.forEach(p => { if(p.class && counts[p.class] !== undefined) counts[p.class]++; });
      const open = CLASSES.filter(c => counts[c] < CLASS_LIMIT);
      if(open.length) return open[Math.floor(Math.random() * open.length)];
      // hepsi doluysa en az doluyu seç
      return CLASSES.reduce((a, b) => counts[a] <= counts[b] ? a : b);
    } catch(e){
      // sayım alınamazsa yine de rastgele bir sınıf ver
      return CLASSES[Math.floor(Math.random() * CLASSES.length)];
    }
  }

  function showAuth(){
    clearTimeout(window.__lefFallback);
    authView.style.display = 'flex';
    loader.classList.add('done');
    setTimeout(() => { loader.style.display = 'none'; }, 700);
  }

  // ---------- BOOT: zaten girişliyse doğrudan app.html'e yolla ----------
  (async function boot(){
    try {
      const { data: { session } } = await supabase.auth.getSession();
      clearTimeout(window.__lefFallback);
      if(session){
        window.location.replace('app.html');
        return;
      }
    } catch(e){
      // Supabase'e erişilemezse giriş formunu göster, kullanıcı tekrar denesin
    }
    showAuth();
  })();

  // ---------- TABS ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-block').forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
    });
  });

  // ---------- PASSWORD TOGGLE ----------
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('showing', !showing);
    });
  });

  // ---------- LOGIN ----------
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');
    msg.className = 'msg'; msg.textContent = '';

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!username || !password){
      msg.classList.add('error'); msg.textContent = 'Kullanıcı adı ve şifre gerekli.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
    const { error } = await supabase.auth.signInWithPassword({
      email: usernameToEmail(username),
      password
    });
    btn.disabled = false; btn.textContent = 'Giriş Yap';

    if(error){
      msg.classList.add('error');
      msg.textContent = 'Kullanıcı adı veya şifre hatalı.';
      return;
    }
    window.location.replace('app.html');
  });

  // ---------- REGISTER ----------
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('registerMsg');
    const btn = document.getElementById('registerBtn');
    msg.className = 'msg'; msg.textContent = '';

    const rawUsername = document.getElementById('regUsername').value.trim();
    const username = rawUsername.toLowerCase().replace(/[^a-z0-9_.]/g, '');
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;

    if(!username){
      msg.classList.add('error'); msg.textContent = 'Geçerli bir kullanıcı adı gir.';
      return;
    }
    if(password.length < 6){
      msg.classList.add('error'); msg.textContent = 'Şifre en az 6 karakter olmalı.';
      return;
    }
    if(password !== password2){
      msg.classList.add('error'); msg.textContent = 'Şifreler eşleşmiyor.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Kayıt oluşturuluyor...';

    const assignedClass = await pickRandomClass();

    const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
      email: usernameToEmail(username),
      password,
      options: { data: { username, class: assignedClass } }
    });

    if(signUpError){
      btn.disabled = false; btn.textContent = 'Kayıt Ol';
      msg.classList.add('error');
      msg.textContent = signUpError.message.includes('already registered')
        ? 'Bu kullanıcı adı zaten alınmış.'
        : signUpError.message;
      return;
    }

    // Profil satırını oluştur (DB tetikleyicisi zaten oluşturmuşsa upsert onu günceller)
    if(signUpData?.user){
      await supabase.from('profiles').upsert({
        id: signUpData.user.id,
        username,
        class: assignedClass,
        rank: 'Üye'
      }, { onConflict: 'id' });
    }

    btn.disabled = false; btn.textContent = 'Kayıt Ol';

    if(signUpData?.session){
      window.location.replace('app.html');
    } else {
      msg.classList.add('ok');
      msg.textContent = 'Kayıt oluşturuldu. Şimdi giriş yapabilirsin.';
      document.querySelector('.tab[data-tab="login"]').click();
      document.getElementById('loginUsername').value = username;
    }
  });
</script>

</body>
</html>
