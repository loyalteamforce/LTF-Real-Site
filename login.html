/* ---------- Alt bağlantı ---------- */

<script>
  // Güvenlik ağı: modül script'i (Supabase importu, file:// üzerinden CORS,
  // yavaş/başarısız ağ isteği vb. herhangi bir sebeple) hiç çalışmazsa
  // yükleme ekranı sonsuza kadar açık kalıp arkasını (küreyi) gizlemesin.
  window.__lefFallback = setTimeout(function(){
    var authView = document.getElementById('authView');
    if(authView){ authView.style.display = 'flex'; }
  }, 3000);
</script>

<script type="module">
  import { supabase, usernameToEmail } from './config.js';

  const authView = document.getElementById('authView');
  const CLASSES = ['A', 'B', 'C', 'D'];
  const CLASS_LIMIT = 25;

  // Herkes rastgele bir sınıfa atanır; dolu olmayan sınıflar arasından
  // rastgele seçilir, hepsi doluysa en az doluya düşer.
  async function pickRandomClass(){
    try {
      // Giriş yapmamış kullanıcı profil listesini okuyamaz; sadece sınıf sayılarını veren
      // güvenli fonksiyon kullanılır (oaa-puanlar.sql içinde tanımlı).
      const { data, error } = await supabase.rpc('class_counts');
      if(error || !data) throw error || new Error('no data');
      const counts = {};
      CLASSES.forEach(c => counts[c] = 0);
      data.forEach(p => { if(p.class && counts[p.class] !== undefined) counts[p.class] = Number(p.n); });
      const open = CLASSES.filter(c => counts[c] < CLASS_LIMIT);
      if(open.length) return open[Math.floor(Math.random() * open.length)];
      // hepsi doluysa en az doluyu seç
      return CLASSES.reduce((a, b) => counts[a] <= counts[b] ? a : b);
    } catch(e){
      // sayım alınamazsa yine de rastgele bir sınıf ver
      return CLASSES[Math.floor(Math.random() * CLASSES.length)];
    }
  }

  function showAuth(){
    clearTimeout(window.__lefFallback);
    authView.style.display = 'flex';
  }

  // ---------- BOOT: zaten girişliyse doğrudan app.html'e yolla ----------
  (async function boot(){
    try {
      const { data: { session } } = await supabase.auth.getSession();
      clearTimeout(window.__lefFallback);
      if(session){
        window.location.replace('app.html');
        return;
      }
    } catch(e){
      // Supabase'e erişilemezse giriş formunu göster, kullanıcı tekrar denesin
    }
    showAuth();
  })();


  // ---------- Giriş/kayıt sonrası: site arka planda yüklenir (en fazla ~15 sn beklenir) ----------
  function preloadApp(){
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const jobs = [];
    ['app.html', 'bakim-kilidi.js'].forEach(u => jobs.push(fetch(u).then(r => r.blob()).catch(() => {})));
    ['lef-logo.png', 'crest.png'].forEach(u => jobs.push(new Promise(res => {
      const i = new Image(); i.onload = i.onerror = () => res(); i.src = u;
    })));
    return Promise.race([Promise.all(jobs), wait(15000)]);
  }

  function showLoadScreen(){
    const d = document.createElement('div');
    d.id = 'loadScreen';
    d.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#000;display:grid;place-items:center;opacity:0;transition:opacity .35s ease';
    d.innerHTML = '<style>@keyframes lefPulse{0%,100%{opacity:.5;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}</style>' +
      '<img src="crest.png" alt="" style="width:clamp(90px,18vw,150px);height:auto;animation:lefPulse 1.8s ease-in-out infinite;transition:opacity .45s ease">';
    document.body.appendChild(d);
    requestAnimationFrame(() => { d.style.opacity = '1'; });
    return d;
  }

  // Giriş/kayıt başarılı → siyah ekran + arma, site arka planda yüklenir,
  // hazır olunca arma kaybolur ve site açılır. (Ses / uzun intro yok.)
  async function enterSite(){
    const screen = showLoadScreen();
    const wait = ms => new Promise(r => setTimeout(r, ms));
    await Promise.all([preloadApp(), wait(900)]);       // en az 0,9 sn: yanıp sönme olmasın
    screen.querySelector('img').style.opacity = '0';     // arma kaybolur
    await wait(450);
    window.location.replace('app.html');
  }

  // ---------- LOGIN ----------
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');
    msg.className = 'msg'; msg.textContent = '';

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!username || !password){
      msg.classList.add('error'); msg.textContent = 'Kullanıcı adı ve şifre gerekli.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
    const { error } = await supabase.auth.signInWithPassword({
      email: usernameToEmail(username),
      password
    });
    btn.disabled = false; btn.textContent = 'Giriş Yap';

    if(error){
      msg.classList.add('error');
      msg.textContent = 'Kullanıcı adı veya şifre hatalı.';
      return;
    }
    await enterSite();
  });

  // ---------- REGISTER ----------
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('registerMsg');
    const btn = document.getElementById('registerBtn');
    msg.className = 'msg'; msg.textContent = '';

    const rawUsername = document.getElementById('regUsername').value.trim();
    const username = rawUsername.toLowerCase().replace(/[^a-z0-9_.]/g, '');
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;

    if(!username){
      msg.classList.add('error'); msg.textContent = 'Geçerli bir kullanıcı adı gir.';
      return;
    }
    if(password.length < 8){
      msg.classList.add('error'); msg.textContent = 'Şifre en az 8 karakter olmalı.';
      return;
    }
    if(password !== password2){
      msg.classList.add('error'); msg.textContent = 'Şifreler eşleşmiyor.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Kayıt oluşturuluyor...';

    const assignedClass = await pickRandomClass();

    const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
      email: usernameToEmail(username),
      password,
      options: { data: { username, class: assignedClass } }
    });

    if(signUpError){
      btn.disabled = false; btn.textContent = 'Kayıt Ol';
      msg.classList.add('error');
      msg.textContent = signUpError.message.includes('already registered')
        ? 'Bu kullanıcı adı zaten alınmış.'
        : signUpError.message;
      return;
    }

    // Profil satırını oluştur (DB tetikleyicisi zaten oluşturmuşsa upsert onu günceller)
    if(signUpData?.user){
      await supabase.from('profiles').upsert({
        id: signUpData.user.id,
        username,
        class: assignedClass,
        rank: 'Üye'
      }, { onConflict: 'id' });
    }

    btn.disabled = false; btn.textContent = 'Kayıt Ol';

    if(signUpData?.session){
      await enterSite();
    } else {
      setMode('login');
      document.getElementById('loginUsername').value = username;
      const lm = document.getElementById('loginMsg');
      lm.className = 'msg ok';
      lm.textContent = 'Kayıt oluşturuldu. Şimdi giriş yapabilirsin.';
    }
  });
</script>

<script>
  // ---------- Arayüz davranışları (Supabase yüklenmese de çalışsın diye ayrı script) ----------
  function setMode(mode){
    document.querySelectorAll('.si-form').forEach(function(f){ f.classList.toggle('active', f.dataset.mode === mode); });
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('registerMsg').textContent = '';
  }
  document.querySelectorAll('[data-switch]').forEach(function(b){
    b.addEventListener('click', function(){ setMode(b.dataset.switch); });
  });
  document.querySelectorAll('.pw-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      var input = document.getElementById(btn.dataset.target);
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('showing', !showing);
    });
  });

  // ---------- Düğme tıklama dalgası (ripple) ----------
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.btn');
    if(!btn || btn.disabled) return;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'btn-ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left) + 'px';
    ripple.style.top = (e.clientY - rect.top) + 'px';
    btn.appendChild(ripple);
    setTimeout(function(){ ripple.remove(); }, 700);
  });
</script>

</body>
</html>
