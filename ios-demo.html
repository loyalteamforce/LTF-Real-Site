<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>iOS animasyonları – deneme</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0b0f;color:#fff;font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 76px) 16px 60px;max-width:560px;margin-inline:auto}
  h1{font-size:22px;margin:0 0 4px}
  p.s{margin:0 0 20px;opacity:.6;font-size:14px}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.5;margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  button.b{padding:16px 10px;border:0;border-radius:14px;background:#1c1c1e;color:#fff;font:inherit;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips button{padding:10px 16px;border:0;border-radius:999px;background:#2c2c2e;color:#fff;font:inherit;font-size:14px}
  .syms{display:flex;gap:12px}
  .syms button{width:64px;height:64px;border:0;border-radius:18px;background:#1c1c1e;color:#0a84ff;font-size:28px;display:flex;align-items:center;justify-content:center;padding:0}
  .syms svg{width:1em;height:1em}
  .list{border-radius:14px;overflow:hidden}
  .srow{padding:17px 16px;background:#1c1c1e;border-bottom:1px solid #2c2c2e}
  .jg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:10px 6px}
  .tile{aspect-ratio:1;border-radius:16px}
</style>
</head>
<body>
<h1>iOS animasyonları</h1>
<p class="s">9 desenin hepsi burada. Telefondan açıp dene.</p>

<h2>Ekran geri bildirimleri</h2>
<div class="grid">
  <button class="b" id="b-island">Dynamic Island</button>
  <button class="b" id="b-live">Live Activity</button>
  <button class="b" id="b-hud">HUD</button>
  <button class="b" id="b-sheet">Action sheet</button>
  <button class="b" id="b-shake" style="grid-column:span 2">Shake to undo (telefonu salla ya da dokun)</button>
</div>

<h2>Haptic feedback</h2>
<div class="chips">
  <button data-h="light">Hafif</button>
  <button data-h="medium">Orta</button>
  <button data-h="heavy">Güçlü</button>
  <button data-h="success">Başarılı</button>
  <button data-h="error">Hata</button>
</div>

<h2>Symbol effect</h2>
<div class="syms" id="syms"></div>

<h2>Swipe actions (sola kaydır)</h2>
<div class="list">
  <div class="srow" data-ios-swipe="sil">Sola kaydır: Sil</div>
  <div class="srow" data-ios-swipe="arsiv,sil">Sola kaydır: Arşiv + Sil</div>
  <div class="srow" id="custom-row">Sola kaydır: özel butonlar</div>
</div>

<h2>Jiggle mode (uzun bas)</h2>
<div class="jg" data-ios-jiggle>
  <div class="tile" style="background:#ff453a"></div>
  <div class="tile" style="background:#ff9f0a"></div>
  <div class="tile" style="background:#ffd60a"></div>
  <div class="tile" style="background:#30d158"></div>
  <div class="tile" style="background:#64d2ff"></div>
  <div class="tile" style="background:#0a84ff"></div>
  <div class="tile" style="background:#bf5af2"></div>
  <div class="tile" style="background:#ff375f"></div>
</div>

<script src="ios-fx.js"></script>
<script>
(function(){
  var fx = window.iosFx;
  function $(s){ return document.querySelector(s); }

  $('#b-island').onclick = function(){ fx.island({ text:'Şarj oluyor', sub:'%82 · 12 dk kaldı', icon:'bolt' }); };

  $('#b-live').onclick = function(){
    var a = fx.liveActivity({ title:'Gönderiliyor', subtitle:'Dosya yükleniyor', icon:'share' });
    var p = 0;
    var t = setInterval(function(){
      p += .12 + Math.random() * .1;
      if (p >= 1) { clearInterval(t); a.end('Gönderildi'); } else a.update({ progress:p });
    }, 450);
  };

  $('#b-hud').onclick = function(){ fx.hud({ icon:'check', text:'Kaydedildi' }); };

  $('#b-sheet').onclick = function(){
    fx.actionSheet({
      title:'Bu gönderi',
      actions:[
        { label:'Paylaş', onClick:function(){ fx.hud({ icon:'share', text:'Paylaşıldı' }); } },
        { label:'Sil', destructive:true, onClick:function(){ fx.hud({ icon:'trash', text:'Silindi' }); } }
      ]
    });
  };

  function undone(){ fx.hud({ icon:'check', text:'Geri alındı' }); }
  $('#b-shake').onclick = function(){ fx.undoAlert(undone); };
  fx.shakeToUndo(undone);

  [].forEach.call(document.querySelectorAll('[data-h]'), function(b){
    b.onclick = function(){ fx.haptic(b, b.getAttribute('data-h')); };
  });

  var syms = [['heart','bounce'],['bell','wiggle'],['wifi','variable'],['speaker','pulse'],['share','scale']];
  syms.forEach(function(s){
    var b = document.createElement('button');
    b.setAttribute('data-ios-symbol', s[1]);
    b.setAttribute('aria-label', s[0]);
    b.innerHTML = fx.icon(s[0]);
    $('#syms').appendChild(b);
  });

  fx.swipeActions($('#custom-row'), [
    { label:'Daha fazla', color:'#8e8e93', onClick:function(){ fx.hud({ icon:'info', text:'Daha fazla' }); } },
    { label:'Sil', color:'#ff3b30', remove:true, onClick:function(){ fx.hud({ icon:'trash', text:'Silindi' }); } }
  ]);
  document.addEventListener('ios-swipe', function(e){
    fx.hud({ icon:'trash', text: e.detail.action === 'sil' ? 'Silindi' : 'Arşivlendi' });
  });
})();
</script>
</body>
</html>
